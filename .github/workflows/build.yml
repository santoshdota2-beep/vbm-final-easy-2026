name: Build VBM v12 FUN GOD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          
      - name: Create Project
        run: |
          flutter create . --project-name vbm_ultra_v12 --platforms=android --org com.vbm.fungod
          flutter pub get
          
      - name: Inject VBM v12 GOD Code
        run: |
          cat > pubspec.yaml << 'PUBEOF'
name: vbm_ultra_v12
description: VBM v12 FUN GOD - Super Powerful
publish_to: 'none'
version: 12.0.0+12
environment:
  sdk: ">=3.2.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
flutter:
  uses-material-design: true
PUBEOF
          mkdir -p lib
          echo "" | base64 -d > lib/main.dart
          echo "Main.dart created:"
          wc -l lib/main.dart
          flutter pub get
          
      - name: Build APK
        run: flutter build apk --release --split-per-abi
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VBM-v12-FUN-GOD-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
